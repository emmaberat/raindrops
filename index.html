  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17110A;
      --ink: #FFF3D0;
      --muted: #D8BC72;
      --line: #4A3A14;
      --card: #241B0E;

    }
  }
  :root[data-theme="dark"] {
    --bg: #17110A;
    --ink: #FFF3D0;
    --muted: #D8BC72;
    --line: #4A3A14;
    --card: #241B0E;
    --accent: #FFCC00;
    --accent-ink: #1A1208;
    --band: #0C0904;
    --danger: #FF8A4C;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .display, .date, .prompt, .cap, .save, .slim, .big .word, .nav .d {
    font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600; font-variation-settings: "SOFT" 100; text-transform: none;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 24px 20px 48px; min-height: 100vh; display: flex; flex-direction: column; }
  #app.full { max-width: none; margin: 0; padding: 0; min-height: 100vh; min-height: 100dvh; }

  /* Home: dark band, three flat colour blocks, dark band */
  .home { display: flex; flex-direction: column; flex: 1; }

  .kicker { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--band-accent); }
  .date { font-size: 40px; line-height: 1.05; letter-spacing: .01em; margin: 8px 0 6px; }
  .tagline { color: var(--band-accent); font-size: 15px; font-weight: 600; margin: 0; }
  .big-buttons { display: flex; flex-direction: column; flex: 1; }
  .big {
    appearance: none; border: 0; border-radius: 0; padding: 14px 24px; width: 100%;
    flex: 1; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font: inherit; line-height: 1; color: var(--on-color); cursor: pointer; transition: filter .12s ease;
  }
  .big:hover { filter: brightness(1.04); }
  .big:active { filter: brightness(.93); }
  .big .lead { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .big .word { font-size: clamp(52px, 19vw, 92px); line-height: 1; letter-spacing: .01em; }
  .beautiful { background: var(--beautiful); }
  .kind { background: var(--kind); }
  .did { background: var(--did); }
  .band-bottom { background: var(--band); padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  .slim {
    appearance: none; border: 0; border-radius: 8px; width: 100%; min-height: 72px;
    background: var(--ideas); color: var(--on-color); cursor: pointer; transition: filter .12s ease;
    font-size: 38px; letter-spacing: .03em; line-height: 1;
  }
  .slim:active { filter: brightness(.93); }
  .review-link {
    appearance: none; border: 2px solid var(--band-accent); background: transparent; color: var(--band-accent);
    border-radius: 8px; padding: 14px 20px; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .02em; cursor: pointer; text-align: center;
  }
  .band-bottom .row { display: flex; gap: 12px; }
  .band-bottom .row .review-link { flex: 1; min-width: 0; padding-inline: 12px; }
  .review-link.glow { background: var(--band-accent); color: var(--on-color); }
  .big:focus-visible, .slim:focus-visible, .review-link:focus-visible, .cap:focus-visible { outline: 3px solid var(--ink); outline-offset: -6px; }
  .slim:focus-visible, .review-link:focus-visible { outline-color: var(--band-ink); outline-offset: 3px; }

  /* New moment */
  .capture { display: flex; gap: 12px; margin: 6px 0 4px; }
  .cap {
    flex: 1; min-height: 124px; appearance: none; border: 0; border-radius: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--on-color); font-size: 26px; letter-spacing: .04em; line-height: 1; transition: filter .12s ease;
  }
  .cap:active { filter: brightness(.93); }
  .cap.rec { background: var(--danger) !important; color: var(--bg); animation: recpulse 1.4s ease-in-out infinite; }
  @keyframes recpulse { 50% { opacity: .78; } }
  @media (prefers-reduced-motion: reduce) { .cap.rec { animation: none; } }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; min-height: 44px; }
  .link { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700; padding: 10px 0; cursor: pointer; }
  .tag { display: inline-block; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--on-color); }
  .prompt { font-size: 44px; line-height: 1.05; margin: 14px 0 6px; letter-spacing: .01em; }
  .stamp { color: var(--muted); font-size: 15px; font-weight: 600; margin-bottom: 18px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; border: 2px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--ink); font: inherit; padding: 14px 16px; outline: none;
  }
  textarea:focus { border-color: var(--ink); }
  .attach { margin: 10px 0; position: relative; }
  .attach img { width: 100%; border-radius: 14px; display: block; }
  .attach audio { width: 100%; }
  .x {
    position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.6); color: #fff; font-size: 18px; cursor: pointer;
  }
  .attach.audio-wrap { display: flex; align-items: center; gap: 8px; }
  .attach.audio-wrap .x { position: static; flex: none; background: var(--line); color: var(--ink); }
  .save {
    margin-top: auto; appearance: none; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 26px; letter-spacing: .06em; line-height: 1; border-radius: 10px; padding: 18px; cursor: pointer;
  }
  .save:disabled { opacity: .35; cursor: default; }
  .hint { color: var(--muted); font-size: 14px; font-weight: 600; margin: 6px 0 0; }

  /* Look back */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 20px; }
  .nav button { appearance: none; border: 2px solid var(--ink); background: transparent; color: var(--ink); width: 44px; height: 44px; border-radius: 10px; font-size: 20px; cursor: pointer; }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav .d { text-align: center; font-size: 30px; line-height: 1.05; letter-spacing: .01em; }
  .nav .d small { display: block; font-family: "Open Sans", system-ui, sans-serif; text-transform: none; color: var(--muted); font-weight: 600; font-size: 14px; letter-spacing: 0; margin-top: 2px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-wd { text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--muted); padding: 2px 0 4px; }
  .cal-day {
    appearance: none; border: 2px solid transparent; background: var(--card); color: var(--ink); border-radius: 10px;
    aspect-ratio: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font: inherit; font-size: 15px; font-weight: 700; line-height: 1; cursor: pointer; padding: 0;
  }
  .cal-day.has { background: var(--band); color: var(--band-ink); }
  .cal-day.today { border-color: var(--ink); }
  .cal-day.has.today { border-color: var(--band-accent); }
  .cal-day:disabled { opacity: .35; cursor: default; }
  .cal-day:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .cal-dots { display: flex; gap: 3px; min-height: 7px; }
  .cal-dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .cal-sum { margin-top: 18px; }
  .entry { background: var(--card); color: var(--on-color); border-radius: 14px; padding: 18px 18px 14px; margin-bottom: 14px; }
  .entry.beautiful { background: var(--beautiful); }
  .entry.kind { background: var(--kind); }
  .entry.did { background: var(--did); }
  .entry.ideas { background: var(--ideas); }
  .tag.inv { background: var(--band); color: var(--band-accent); }
  .the-end { text-align: center; padding: 28px 0 8px; }
  .the-end .display { font-size: 34px; line-height: 1.1; letter-spacing: .01em; }
  .the-end p { margin: 8px 0 0; color: var(--muted); font-weight: 600; }
  .entry .meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .entry .foot { margin: 8px 0 0; }
  .entry .time { color: var(--on-color); opacity: .72; font-size: 14px; font-weight: 700; }
  .entry p { margin: 10px 0; font-size: 21px; font-weight: 600; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .entry img { width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
  .entry audio { width: 100%; margin-top: 8px; }
  .del { appearance: none; background: none; border: 0; color: var(--on-color); opacity: .72; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 6px 0; }
  .empty { text-align: center; color: var(--muted); margin: 60px 0; }
  .summary { color: var(--muted); font-weight: 600; margin: 0 0 18px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 10px; font-weight: 700; z-index: 9; }
  /* Lower-key: sentence case, softer serif, rounder corners */
  .date, .prompt, .cap, .save, .slim, .big .word, .nav .d, .the-end .display { letter-spacing: -.01em; }
  .date { font-size: 34px; }
  .kicker { text-transform: none; letter-spacing: .02em; font-size: 15px; }
  .big .word { font-size: clamp(46px, 16vw, 78px); }
  .big img.hand { height: auto; display: block; margin-top: 2px; }
  .slim { font-size: 30px; border-radius: 12px; }
  .review-link { border-radius: 12px; }
  .cap { font-size: 24px; border-radius: 18px; }
  .save { font-size: 22px; border-radius: 14px; }
  .prompt { font-size: 36px; }
  .nav .d { font-size: 26px; }
  .nav button { border-radius: 12px; }
  .tag { text-transform: none; letter-spacing: .02em; font-size: 13px; border-radius: 8px; }
  .cal-day { border-radius: 12px; }
  .the-end .display { font-size: 30px; }

  /* Cloth: pale ground, colour patches with soft, slightly frayed edges */
  .home { background: var(--bg); }
  .band-top { position: relative; background: none; isolation: isolate; color: var(--band-ink); padding-bottom: 46px; }
  .band-top::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background-image: linear-gradient(rgba(20, 13, 5, .46), rgba(20, 13, 5, .46)), var(--hero-img);
    background-size: cover; background-position: center;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent);
  }
  .big-buttons { padding: 0 14px; gap: 0; margin-top: -18px; }
  .big, .slim { position: relative; background: none !important; isolation: isolate; border-radius: 0; }
  .big { min-height: 140px; }
  .big::before, .slim::before {
    content: ""; position: absolute; inset: 10px 4px; z-index: -1; border-radius: 34px;
    background: var(--c); filter: url(#cloth);
  }
  .big.beautiful { --c: var(--beautiful); } .big.kind { --c: var(--kind); } .big.did { --c: var(--did); } .slim.ideas { --c: var(--ideas); }
  .band-bottom { background: none; padding: 6px 14px 24px; }
  .slim { min-height: 84px; font-size: 30px; }
  .slim::before { inset: 6px 4px; border-radius: 26px; }
  .review-link { border-color: var(--ink); color: var(--ink); border-radius: 14px; }
  .review-link.glow { background: var(--accent); color: var(--accent-ink); }
  .slim:focus-visible, .review-link:focus-visible { outline-color: var(--ink); }

  /* Cloth on the other pages too */
  .cap, .save, .entry, .cal-day.has { position: relative; isolation: isolate; background: none !important; }
  .cap::before, .save::before, .entry::before, .cal-day.has::before {
    content: ""; position: absolute; z-index: -1; background: var(--c); filter: url(#cloth);
  }
  .cap::before { inset: 4px; border-radius: 26px; }
  .save::before { inset: 2px 0; border-radius: 22px; --c: var(--accent); }
  .entry { margin-bottom: 8px; padding: 26px 24px 20px; }
  .entry::before { inset: 6px 0; border-radius: 30px; }
  .entry.beautiful { --c: var(--beautiful); } .entry.kind { --c: var(--kind); } .entry.did { --c: var(--did); } .entry.ideas { --c: var(--ideas); }
  .cal-day.has { color: var(--on-color); }
  .cal-day.has::before { inset: 1px; border-radius: 14px; --c: var(--ideas); }
  .cal-day.has.today { border-color: var(--ink); }
  .cap.rec::before { background: var(--danger); }
  .cap.rec { background: none !important; }
  textarea { border-radius: 20px; border-width: 1.5px; }
  .tag { background: var(--c); }

  .cap::before, .save::before, .cal-day.has::before { filter: url(#clothS); }
  .save::before { --c: var(--beautiful); } .save { color: var(--on-color); }
  .cal-day.has::before { --c: var(--beautiful); }
  .cal-dots i { box-shadow: 0 0 0 1px rgba(26,18,8,.45); }
  .kicker { color: #8DB5D1; font-size: 18px; }
  .prompt { color: #3F6D8C; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .prompt { color: #8DB5D1; } }
  :root[data-theme="dark"] .prompt { color: #8DB5D1; }

  .welcome { margin: 14px 14px 0; padding: 14px 16px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--line); color: var(--ink); font-size: 15px; line-height: 1.45; position: relative; z-index: 1; }
  .welcome p { margin: 0 0 6px; font-weight: 600; }
  .welcome p.tip { font-weight: 500; color: var(--muted); }
  .welcome button { appearance: none; border: 0; background: none; font: inherit; font-weight: 800; color: var(--ink); padding: 6px 0 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .big-buttons { margin-top: 0 !important; }
  .band-top .date, .band-top .tagline, .band-top .kicker { text-shadow: 0 1px 6px rgba(20,13,5,.55); }
  .band-top .tagline { color: var(--band-ink); }
  .band-top .kicker { text-shadow: 0 1px 3px rgba(20,13,5,.8), 0 0 10px rgba(20,13,5,.6); }
</style>

/* ---------- Storage (IndexedDB, so photos and voice notes fit) ---------- */
const DB_NAME = "goodtoday", STORE = "entries";
let dbPromise;
function db() {
  if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const s = req.result.createObjectStore(STORE, { keyPath: "id" });
      s.createIndex("day", "day");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const t = d.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => resolve(out && out.result);
    t.onerror = () => reject(t.error);
  });
}
const saveEntry = e => tx("readwrite", s => s.put(e));
const deleteEntry = id => tx("readwrite", s => s.delete(id));
const entriesForDay = key => tx("readonly", s => s.index("day").getAll(key))
  .then(list => list.sort((a, b) => a.ts.localeCompare(b.ts)));
const countForDay = key => tx("readonly", s => s.index("day").count(key));

/* ---------- Helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtLong = d => d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
const fmtTime = d => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
const $ = (sel, root = document) => root.querySelector(sel);
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let urls = [];           // object URLs to release on each render
let cleanup = () => {};  // per-view teardown (e.g. stop the microphone)
function objUrl(blob) { const u = URL.createObjectURL(blob); urls.push(u); return u; }
function resetView() {
  cleanup(); cleanup = () => {};
  urls.forEach(URL.revokeObjectURL); urls = [];
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

async function shrinkPhoto(file, max = 1600) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (_) {
    bmp = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img); img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  const w = bmp.width, h = bmp.height, scale = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.82));
}

/* ---------- Views ---------- */
async function viewHome() {
  const now = new Date();
  const n = await countForDay(dayKey(now));
  const evening = now.getHours() >= 18;
  app.className = "full";
  app.innerHTML = `
    <div class="home">
      <div class="band-top">
        <div class="kicker">Raindrops</div>
        <div class="date">${esc(fmtLong(now))}</div>
        <p class="tagline">Good Things Happen. Hold Onto Them.</p>
      </div>
      <div class="big-buttons">
        ${Object.entries(TYPES).filter(([k]) => k !== "ideas").map(([k, t]) => `<button class="big ${t.cls}" data-type="${k}" aria-label="${esc(t.label)}"><span class="lead">${esc(t.lead)}</span>${HAND[t.word] ? `<img class="word hand" src="${HAND[t.word]}" alt="" style="width:${HW[t.word]}">` : `<span class="word">${esc(t.word)}</span>`}</button>`).join("")}
      </div>
      <div class="band-bottom">
        <button class="slim ideas" data-type="ideas" aria-label="${esc(TYPES.ideas.label)}">ideas</button>
        <div class="row">
          <button class="review-link ${evening ? "glow" : ""}" id="review">Look back on today</button>
          <button class="review-link" id="calendar">Calendar</button>
        </div>
      </div>
    </div>`;

  // One-time welcome (and a home-screen tip on phones). Remembered per device.
  const WKEY = "raindrops-welcome";
  let seenWelcome = false;
  try { seenWelcome = !!localStorage.getItem(WKEY); } catch (_) {}
  if (!seenWelcome) {
    const ua = navigator.userAgent || "";
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const ios = /iPhone|iPad|iPod/.test(ua), android = /Android/.test(ua);
    const tip = standalone ? "" : ios ? "Tip: tap Share, then Add to Home Screen, so Raindrops sits with your other apps."
      : android ? "Tip: open the browser menu, then Add to Home screen, so Raindrops sits with your other apps." : "";
    const w = document.createElement("div"); w.className = "welcome";
    w.innerHTML = `<p>Tap what fits. Add a photo, a few words, or just speak. It saves itself.</p>${tip ? `<p class="tip">${tip}</p>` : ""}<button type="button">Got it</button>`;
    w.querySelector("button").onclick = () => { try { localStorage.setItem(WKEY, "1"); } catch (_) {} w.remove(); };
    app.querySelector(".big-buttons").before(w);
  }
  app.querySelectorAll(".big, .slim").forEach(b => b.onclick = () => (location.hash = "#/new/" + b.dataset.type));
  $("#review").onclick = () => (location.hash = "#/day/" + dayKey(now));
  $("#calendar").onclick = () => (location.hash = "#/calendar/" + dayKey(now).slice(0, 7));
}

function viewNew(typeKey) {
  const type = TYPES[typeKey];
  if (!type) { location.hash = "#/"; return; }
  const opened = new Date();
  const draft = { photo: null, audio: null };
  const entry = { id: newId(), type: typeKey, ts: opened.toISOString(), day: dayKey(opened), note: "", photo: null, audio: null };
  let recorder = null, stream = null, chunks = [], recTimer = null, recStart = 0;
  let alive = true, saved = false, saveTimer = null, chain = Promise.resolve();

  const svg = inner => `<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const ICON_CAM = svg('<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>');
  const ICON_MIC = svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>');

  app.innerHTML = `
    <div class="top">
      <button class="link" id="back">‹ Back</button>
      <span class="tag" style="--c:var(--${typeKey})">${esc(type.short)}</span>
    </div>
    <div class="prompt">Hold onto them.</div>
    <div class="stamp">${esc(fmtLong(opened))} · ${esc(fmtTime(opened))}</div>
    <div class="capture">
      <button class="cap" id="photoBtn" style="--c:var(--${typeKey})">${ICON_CAM}<span>Photo</span></button>
      <button class="cap" id="micBtn" style="--c:var(--${typeKey})">${ICON_MIC}<span id="micLabel">Voice</span></button>
    </div>
    <div id="attachments"></div>
    <textarea id="note" placeholder="${esc(type.prompt)} Or just a few words."></textarea>
    <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="audioInput" accept="audio/*" capture hidden>
    <p class="hint" id="hint"></p>
    <div style="flex:1"></div>
    <button class="save" id="save">Done</button>`;

  const note = $("#note"), att = $("#attachments"), hint = $("#hint"), micBtn = $("#micBtn"), micLabel = $("#micLabel");

  // Everything saves as soon as it exists. Done just closes the page.
  async function doPersist() {
    const empty = !(entry.note || entry.photo || entry.audio);
    try {
      if (empty) { if (saved) { await deleteEntry(entry.id); saved = false; } }
      else { await saveEntry(entry); saved = true; if (alive) hint.textContent = "Saved"; }
    } catch (_) { if (alive) hint.textContent = "Couldn't save. Is storage full?"; }
  }
  function persist() {
    entry.note = note.value.trim(); entry.photo = draft.photo; entry.audio = draft.audio;
    chain = chain.then(doPersist);
    return chain;
  }

  const refresh = () => {
    att.innerHTML = "";
    if (draft.photo) {
      const w = document.createElement("div"); w.className = "attach";
      w.innerHTML = `<img alt="Your photo" src="${objUrl(draft.photo)}"><button class="x" aria-label="Remove photo">×</button>`;
      $(".x", w).onclick = () => { draft.photo = null; refresh(); persist(); };
      att.appendChild(w);
    }
    if (draft.audio) {
      const w = document.createElement("div"); w.className = "attach audio-wrap";
      w.innerHTML = `<audio controls src="${objUrl(draft.audio)}"></audio><button class="x" aria-label="Remove voice note">×</button>`;
      $(".x", w).onclick = () => { draft.audio = null; refresh(); persist(); };
      att.appendChild(w);
    }
  };

  note.oninput = () => { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); };

  $("#back").onclick = async () => { clearTimeout(saveTimer); await persist(); location.hash = "#/"; };

  // Photo: one tap opens the camera, the photo attaches itself.
  const photoInput = $("#photoInput");
  $("#photoBtn").onclick = () => photoInput.click();
  photoInput.onchange = async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    hint.textContent = "Preparing photo…";
    try { draft.photo = await shrinkPhoto(f); hint.textContent = ""; }
    catch (_) { hint.textContent = "Couldn't read that photo."; }
    refresh(); persist();
  };

  // Voice: one tap starts recording, a second tap stops it.
  const audioInput = $("#audioInput");
  audioInput.onchange = e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    draft.audio = f; hint.textContent = ""; refresh(); persist();
  };
  const fallbackAudio = msg => { hint.textContent = msg; audioInput.click(); };
  const stopStream = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } clearInterval(recTimer); };

  // Leaving the app (switching apps, locking the phone, closing the tab) saves too.
  const flush = () => {
    clearTimeout(saveTimer);
    try { if (recorder && recorder.state === "recording") recorder.stop(); } catch (_) {}
    persist();
  };
  const onHide = () => { if (document.hidden) flush(); };
  document.addEventListener("visibilitychange", onHide);
  window.addEventListener("pagehide", flush);

  cleanup = () => {
    document.removeEventListener("visibilitychange", onHide);
    window.removeEventListener("pagehide", flush);
    alive = false; clearTimeout(saveTimer);
    try { if (recorder && recorder.state === "recording") recorder.stop(); else stopStream(); } catch (_) {}
    persist();
  };

  micBtn.onclick = async () => {
    if (recorder && recorder.state === "recording") { recorder.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { fallbackAudio("Recording here isn't supported. Use your device's recorder."); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (_) { fallbackAudio("Microphone is blocked here. Use your device's recorder instead."); return; }
    const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(m => MediaRecorder.isTypeSupported(m));
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      draft.audio = new Blob(chunks, { type: recorder.mimeType || mime || "audio/webm" });
      stopStream();
      if (alive) { micBtn.classList.remove("rec"); micLabel.textContent = "Voice"; hint.textContent = ""; refresh(); }
      persist();
    };
    recorder.start();
    recStart = Date.now();
    micBtn.classList.add("rec");
    const tick = () => { const s = Math.floor((Date.now() - recStart) / 1000); micLabel.textContent = `Stop · ${Math.floor(s / 60)}:${pad(s % 60)}`; };
    tick(); recTimer = setInterval(tick, 500);
  };

  $("#save").onclick = async () => {
    clearTimeout(saveTimer);
    if (recorder && recorder.state === "recording") {
      await new Promise(res => { recorder.addEventListener("stop", res, { once: true }); recorder.stop(); });
    }
    await persist();
    if (saved) toast("Saved. Nice one.");
    location.hash = "#/";
  };
}

async function viewDay(key) {
  const date = parseKey(key);
  const today = dayKey(new Date());
  const list = await entriesForDay(key);
  const prev = new Date(date); prev.setDate(prev.getDate() - 1);
  const next = new Date(date); next.setDate(next.getDate() + 1);
  const isToday = key === today;
  const counts = { beautiful: 0, kind: 0, did: 0 };
  list.forEach(e => counts[e.type]++);

  app.innerHTML = `
    <div class="top"><button class="link" id="home">‹ Home</button><button class="link" id="cal">Calendar</button></div>
    <div class="nav">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="d">${isToday ? "Today" : esc(date.toLocaleDateString(undefined, { weekday: "long" }))}<small>${esc(date.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" }))}</small></div>
      <button id="next" aria-label="Next day" ${isToday || key > today ? "disabled" : ""}>›</button>
    </div>
    ${list.length ? `<p class="summary">${list.length} good ${list.length === 1 ? "thing" : "things"}${isToday ? " today" : ""}.</p>` : ""}
    <div id="list"></div>`;

  $("#home").onclick = () => (location.hash = "#/");
  $("#cal").onclick = () => (location.hash = "#/calendar/" + key.slice(0, 7));
  $("#prev").onclick = () => (location.hash = "#/day/" + dayKey(prev));
  $("#next").onclick = () => (location.hash = "#/day/" + dayKey(next));

  const box = $("#list");
  if (!list.length) {
    box.innerHTML = `<div class="empty">${isToday ? "Nothing yet today.<br>Notice something good and tap a button." : "Nothing saved on this day."}</div>`;
    return;
  }
  for (const e of list) {
    const t = TYPES[e.type] || TYPES.did;
    const card = document.createElement("div");
    card.className = `entry ${t.cls}`;
    card.innerHTML = `
      ${e.note ? `<p>${esc(e.note)}</p>` : ""}
      ${e.photo ? `<img alt="" src="${objUrl(e.photo)}">` : ""}
      ${e.audio ? `<audio controls src="${objUrl(e.audio)}"></audio>` : ""}
      <div class="meta foot"><span class="time">${esc(fmtTime(new Date(e.ts)))}</span><button class="del">Delete</button></div>`;
    const delBtn = $(".del", card);
    let armed = false, armTimer;
    delBtn.onclick = async () => {
      if (!armed) {
        armed = true; delBtn.textContent = "Tap again to delete";
        delBtn.style.fontWeight = "800"; delBtn.style.textDecoration = "underline";
        armTimer = setTimeout(() => { armed = false; delBtn.textContent = "Delete"; delBtn.style.fontWeight = ""; delBtn.style.textDecoration = ""; }, 3000);
        return;
      }
      clearTimeout(armTimer);
      await deleteEntry(e.id); route();
    };
    box.appendChild(card);
  }
}

const entriesForRange = (a, b) => tx("readonly", s => s.index("day").getAll(IDBKeyRange.bound(a, b)));

async function viewCalendar(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const daysIn = new Date(y, m, 0).getDate();
  const list = await entriesForRange(`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(daysIn)}`);
  const byDay = {};
  list.forEach(e => {
    if (!byDay[e.day]) byDay[e.day] = { n: 0, types: new Set() };
    byDay[e.day].n++; byDay[e.day].types.add(e.type);
  });
  const todayKey = dayKey(new Date());
  const lead = (first.getDay() + 6) % 7; // weeks start on Monday
  const prev = new Date(y, m - 2, 1), next = new Date(y, m, 1);
  const prevKey = `${prev.getFullYear()}-${pad(prev.getMonth() + 1)}`;
  const nextKey = `${next.getFullYear()}-${pad(next.getMonth() + 1)}`;
  const canNext = nextKey <= todayKey.slice(0, 7);
  const order = ["beautiful", "kind", "did", "ideas"];
  const daysWith = Object.keys(byDay).length;

  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span></span>`;
  for (let d = 1; d <= daysIn; d++) {
    const key = `${y}-${pad(m)}-${pad(d)}`;
    const info = byDay[key];
    const future = key > todayKey;
    const dots = info ? order.filter(t => info.types.has(t)).map(t => `<i style="background:var(--${t})"></i>`).join("") : "";
    const label = `${fmtLong(new Date(y, m - 1, d))}${info ? ", " + info.n + (info.n === 1 ? " moment" : " moments") : ""}`;
    cells += `<button class="cal-day${info ? " has" : ""}${key === todayKey ? " today" : ""}" data-day="${key}" aria-label="${esc(label)}"${future ? " disabled" : ""}><span>${d}</span><span class="cal-dots">${dots}</span></button>`;
  }

  app.innerHTML = `
    <div class="top"><button class="link" id="home">‹ Home</button></div>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <div class="d">${esc(first.toLocaleDateString(undefined, { month: "long" }))}<small>${y}</small></div>
      <button id="next" aria-label="Next month" ${canNext ? "" : "disabled"}>›</button>
    </div>
    <div class="cal-grid" role="group" aria-label="Days of ${esc(first.toLocaleDateString(undefined, { month: "long", year: "numeric" }))}">
      ${["M", "T", "W", "T", "F", "S", "S"].map(w => `<span class="cal-wd" aria-hidden="true">${w}</span>`).join("")}
      ${cells}
    </div>
    <p class="summary cal-sum">${list.length ? `${list.length} good ${list.length === 1 ? "thing" : "things"} on ${daysWith} ${daysWith === 1 ? "day" : "days"} this month.` : "Nothing saved this month yet."}</p>`;

  $("#home").onclick = () => (location.hash = "#/");
  $("#prev").onclick = () => (location.hash = "#/calendar/" + prevKey);
  $("#next").onclick = () => (location.hash = "#/calendar/" + nextKey);
  app.querySelectorAll(".cal-day").forEach(b => b.onclick = () => (location.hash = "#/day/" + b.dataset.day));
}

/* ---------- Router ---------- */
async function route() {
  resetView();
  app.className = "";
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  window.scrollTo(0, 0);
  try {
    if (parts[0] === "new") viewNew(parts[1]);
    else if (parts[0] === "day" && /^\d{4}-\d{2}-\d{2}$/.test(parts[1] || "")) await viewDay(parts[1]);
    else if (parts[0] === "calendar") await viewCalendar(/^\d{4}-\d{2}$/.test(parts[1] || "") ? parts[1] : dayKey(new Date()).slice(0, 7));
    else await viewHome();
  } catch (err) {
    app.innerHTML = `<p class="empty">Something went wrong opening your journal.<br>${esc(String(err && err.message || err))}</p>`;
  }
}
window.addEventListener("hashchange", route);
// Refresh the home screen when the app is reopened on a new day
document.addEventListener("visibilitychange", () => { if (!document.hidden && !location.hash.startsWith("#/new")) route(); });
route();
</script>
